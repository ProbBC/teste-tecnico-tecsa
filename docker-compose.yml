# Stack completa: backend (API Laravel) + frontend web (app Expo no navegador).
#
#   docker compose up -d --build
#
# - API:        http://localhost:9000
# - App (web):  http://localhost:8081
#
# Obs.: 8081 é a porta padrão do Metro (Expo). Se for rodar o app no celular/emulador
# com `npm start` ao mesmo tempo, pare um dos dois para não conflitar a porta.
#
# O fluxo mobile (Expo Go / emulador Android) continua sendo executado no host
# com `npm start` dentro de frontend/.
services:
  app:
    build:
      context: ./backend
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./backend/laravel-app:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: health_dashboard
      DB_USERNAME: health
      DB_PASSWORD: secret

  web:
    image: nginx:1.27-alpine
    ports:
      - "9000:80"
    volumes:
      - ./backend/laravel-app:/var/www/html
      - ./backend/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8081:80"
    depends_on:
      - web

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: health_dashboard
      MYSQL_USER: health
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
